<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0b3d">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Glimm</title>
<style>
/* Layout: full-bleed canvas game; HUD floats on top; menu is a vertical stack with bottom nav; sheets slide over for meta screens */
:root {
  --cave: #0a1420;
  --glass: rgba(10, 20, 32, .66);
  --panel: rgba(18, 32, 48, .72);
  --line: rgba(160, 210, 230, .16);
  --glow: #ffe08a;
  --glow-deep: #c98f2c;
  --ember: #ff9d5c;
  --teal: #7fe9d9;
  --text: #eef5f3;
  --muted: #93aeb0;
  --good: #8ff2b0;
  --display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--cave); color: var(--text); font-family: var(--body);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
.stage { position: relative; height: 100%; overflow: hidden; }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }
.spark-ico { width: 1em; height: 1em; vertical-align: -.12em; flex: none; }

/* ---------- HUD ---------- */
.hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.score {
  font-family: var(--display); font-weight: 900; font-size: 58px; line-height: 1; color: #fffaf0; font-variant-numeric: tabular-nums;
  text-shadow: 0 0 22px rgba(255, 210, 120, .55), 0 3px 0 rgba(0, 0, 0, .35);
}
.score.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.meter { display: flex; align-items: center; gap: 8px; }
.bar { width: 112px; height: 7px; border-radius: 4px; background: rgba(238, 245, 243, .12); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.bar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ember), var(--glow)); box-shadow: 0 0 10px var(--glow); transition: width .12s linear; }
.meter.low .bar i { animation: blink .5s ease-in-out infinite alternate; }
@keyframes blink { to { opacity: .35; } }
.hud-sub { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; color: var(--glow); font-variant-numeric: tabular-nums; }
.pu { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(10,20,32,.6); border: 1px solid var(--line); color: var(--text); }

.corner {
  position: absolute; top: 12px; width: 44px; height: 44px; border-radius: 50%; z-index: 6;
  display: grid; place-items: center; cursor: pointer; color: var(--text); padding: 0;
  background: rgba(10, 20, 32, .45); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.corner svg { width: 20px; height: 20px; }
#mute { right: max(16px, env(safe-area-inset-right, 0px)); }
#pause { left: max(16px, env(safe-area-inset-left, 0px)); }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

/* ---------- overlays & buttons ---------- */
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  text-align: center; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.btn {
  font-family: var(--display); font-weight: 900; font-size: 22px; color: #3a2205; cursor: pointer;
  background: linear-gradient(180deg, #fff1c2, var(--glow) 45%, #f2b84b); border: 0; border-radius: 999px; padding: 15px 40px;
  box-shadow: 0 0 30px rgba(255, 210, 120, .4), 0 5px 0 #a8701f, inset 0 1px 0 rgba(255,255,255,.7);
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 30px rgba(255, 210, 120, .4), 0 2px 0 #a8701f, inset 0 1px 0 rgba(255,255,255,.7); }
.btn:disabled { filter: grayscale(.6) brightness(.75); cursor: default; }
.btn.ghost { background: rgba(10,20,32,.35); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 18px; padding: 12px 26px; }
.btn.ghost:active { transform: translateY(1px); }
.btn.teal { background: linear-gradient(180deg, #d8fff8, var(--teal) 50%, #45bfae); color: #06322c; box-shadow: 0 0 26px rgba(127,233,217,.35), 0 5px 0 #2a8476, inset 0 1px 0 rgba(255,255,255,.7); }
.sbtn {
  font: 800 14px var(--body); padding: 9px 14px; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap;
  background: var(--glow); color: #3a2205; display: inline-flex; align-items: center; gap: 5px;
}
.sbtn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
.sbtn.teal { background: var(--teal); color: #06322c; }
.sbtn:disabled { opacity: .45; cursor: default; }

.card {
  width: min(350px, 100%); box-sizing: border-box; padding: 24px 20px 22px; border-radius: 26px;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45); display: flex; flex-direction: column; align-items: center; gap: 16px;
  animation: rise .45s cubic-bezier(.2, 1.2, .4, 1) both;
}
@keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
.card h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 32px; }
.card p { margin: 0; color: var(--muted); line-height: 1.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.col { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: stretch; }

/* ---------- menu ---------- */
.menu { justify-content: flex-start; gap: 0; padding-block: 12px 10px; }
.menu .topbar { width: 100%; max-width: 520px; min-height: 44px; display: flex; align-items: center; gap: 8px; padding-right: 56px; box-sizing: border-box; }
.pass { display: grid; gap: 6px; }
.pass .ph, .pass .pr { display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.pass .ph b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pass .pr > span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: rgba(255,255,255,.08); color: var(--muted); }
.pass .pr > span.on { background: var(--glow); color: #3a2205; }
.pc { font: 800 13px var(--body); padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pc.can { background: var(--glow); color: #3a2205; border-color: var(--glow); cursor: pointer; }
.pc.got { opacity: .45; }
.odds { font-size: 11px !important; }
.item.deal { border-color: rgba(255,157,92,.5); }
.piggy-line { font: 800 13px var(--body); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; }
.event .sbtn { flex: none; }
body.has-banner .menu { padding-bottom: 72px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 800; color: var(--glow);
  background: rgba(10,20,32,.55); border: 1px solid var(--line); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.title { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 3vh; }
.title h1 {
  margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(72px, 22vw, 120px); line-height: .85;
  background: linear-gradient(180deg, #fff6d6 10%, var(--glow) 55%, var(--glow-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 26px rgba(255, 200, 110, .45)) drop-shadow(0 4px 0 rgba(60, 30, 5, .6));
}
.title p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }
.grow { flex: 1; min-height: 16px; }
.world-pick { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 380px; }
.arrow {
  width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,20,32,.45);
  font: 900 22px var(--display); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.world-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.world-info b { font-family: var(--display); font-size: 21px; }
.world-info small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); }
.dots i.on { background: var(--glow); }
.cta { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 14px; }
.cta .btn { width: 100%; }
.daily-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.1; }
.daily-btn small { font: 700 12px var(--body); color: var(--muted); }
.event {
  margin-top: 12px; width: 100%; max-width: 340px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 10px 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); cursor: pointer;
}
.event .ico { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 18px; }
.event .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.event b { font-size: 14px; }
.event small { font-size: 12px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--ember), var(--glow)); }
.nav { margin-top: 12px; width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.nav button {
  position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 700 11px var(--body); padding: 8px 2px; border-radius: 14px; cursor: pointer; min-width: 0;
}
.nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.nav svg { width: 24px; height: 24px; }
.ndot { position: absolute; top: 4px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); }

/* ---------- ready / hint ---------- */
.ready { pointer-events: none; justify-content: flex-end; padding-block: 0 21vh; gap: 10px; }
.ready .tap { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); position: relative; animation: tap 1.1s ease-in-out infinite; }
.ready .tap::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: rgba(255,255,255,.85); }
@keyframes tap { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.82); opacity: .6; } }
.tailwind { max-width: 300px; padding: 10px 16px; border-radius: 16px; background: rgba(127,233,217,.14); border: 1px solid rgba(127,233,217,.4); font: 800 14px var(--body); color: var(--teal); text-shadow: none; margin-bottom: 14px; }
.offer { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; box-sizing: border-box; padding: 10px 12px 10px 16px; border-radius: 16px; background: rgba(127,233,217,.08); border: 1px dashed rgba(127,233,217,.35); text-align: left; font-size: 13px; font-weight: 700; }
.ready span { font-family: var(--display); font-size: 20px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.hint {
  position: absolute; left: 16px; right: 16px; bottom: 15vh; text-align: center; pointer-events: none;
  font: 900 19px var(--display); text-shadow: 0 2px 12px #000, 0 0 2px #000; transition: opacity .35s; opacity: 0;
}
.hint.on { opacity: 1; }

/* ---------- results ---------- */
.result { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; width: 100%; }
.medal {
  width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 34px;
  background: radial-gradient(circle at 35% 30%, #ffffff55, transparent 45%), var(--medal, #3b5566);
  box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 0 28px var(--medal-glow, transparent);
}
.stats { display: grid; gap: 8px; text-align: left; }
.stat small { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.stat b { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.rank { font-weight: 800; color: var(--glow); font-size: 14px; }
.earn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 12px 10px 16px; box-sizing: border-box; border-radius: 16px; background: rgba(255,224,138,.08); border: 1px solid rgba(255,224,138,.2); }
.earn b { font: 900 22px var(--display); color: var(--glow); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.newbest {
  font-family: var(--display); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #3a2205;
  background: var(--glow); padding: 5px 12px; border-radius: 999px; box-shadow: 0 0 18px rgba(255, 210, 120, .6);
}
.ring { width: 92px; height: 92px; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font: 900 34px var(--display); }

/* ---------- sheets ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 8; display: flex; justify-content: center; background: rgba(4, 8, 14, .62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.sheet { width: 100%; max-width: 540px; height: 100%; display: flex; flex-direction: column; min-height: 0; animation: rise .35s ease both; }
.sheet header {
  display: flex; align-items: center; gap: 12px; padding-block: 12px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet header h2 { flex: 1; min-width: 0; margin: 0; font: 900 26px var(--display); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 6px; padding-block: 0 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
.tabs button { font: 800 14px var(--body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--text); color: #0a1420; border-color: var(--text); }
.sheet-body {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px;
  padding-block: 4px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sec { font: 800 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; text-align: left; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
}
.tile canvas { width: 104px; height: 74px; }
.tile b { font-size: 15px; }
.tile small { color: var(--muted); font-size: 12px; min-height: 2.4em; line-height: 1.2; }
.tile.sel { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow), 0 0 18px rgba(255,210,120,.2); }
.tile.locked canvas { filter: brightness(.82) saturate(.9); }
.item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; text-align: left; }
.item .ic { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 20px; background: rgba(255,255,255,.06); }
.item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item .txt b { font-size: 15px; }
.item .txt small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.item.done { opacity: .55; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
.pips i.on { background: var(--glow); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border-radius: 12px; padding: 8px 2px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
.day b { font-size: 13px; color: var(--glow); font-variant-numeric: tabular-nums; }
.day.got { opacity: .45; }
.day.now { border-color: var(--glow); box-shadow: 0 0 14px rgba(255,210,120,.3); color: var(--text); }
.toggle { width: 52px; height: 30px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; background: rgba(255,255,255,.16); display: flex; flex: none; }
.toggle i { width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle.on { background: var(--teal); }
.toggle.on i { transform: translateX(22px); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.seg button { font: 800 13px var(--body); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.seg button.on { background: var(--text); color: #0a1420; }
.note { color: var(--muted); font-size: 13px; line-height: 1.45; text-align: left; }
.table { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; text-align: left; font-variant-numeric: tabular-nums; }
.table .n { color: var(--muted); font-weight: 800; }
.table b { font-family: var(--display); font-size: 18px; text-align: right; }

/* ---------- toasts, share, ad ---------- */
.toasts { position: absolute; bottom: max(22px, env(safe-area-inset-bottom, 0px)); left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
  background: rgba(10, 20, 32, .9); border: 1px solid rgba(255,224,138,.35); box-shadow: 0 10px 30px rgba(0,0,0,.4);
  animation: toast 2.3s ease both;
}
@keyframes toast { 0% { opacity: 0; transform: translateY(10px) scale(.96); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
.share-img { width: 100%; max-width: 260px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
textarea.share-txt { width: 100%; box-sizing: border-box; min-height: 74px; resize: none; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font: 600 13px var(--body); padding: 10px; -webkit-user-select: text; user-select: text; }
.ad { position: absolute; inset: 0; z-index: 30; background: #04070c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
.ad b { font: 900 26px var(--display); }
.ad small { color: var(--muted); max-width: 30ch; line-height: 1.4; }

/* ---------- candy theme: saturated jewel tones, outlined type, chunky glossy controls ---------- */
:root {
  --cave: #1a0b3d; --glass: rgba(52, 20, 110, .9); --panel: rgba(78, 34, 150, .62); --line: rgba(255, 255, 255, .22);
  --glow: #ffd23f; --glow-deep: #ff8a00; --ember: #ff5fa2; --teal: #2ee6c5; --text: #ffffff; --muted: #d6c6ff; --ink: #2a0f5c;
}
.btn { color: #fff; border-radius: 22px; background: linear-gradient(180deg, #a4ff7f 0%, #4fe35f 45%, #22b84a 100%);
  box-shadow: 0 6px 0 #138a35, 0 10px 24px rgba(20, 120, 50, .45), inset 0 2px 0 rgba(255,255,255,.65), inset 0 -4px 0 rgba(0,0,0,.08);
  text-shadow: 0 2px 0 #138a35, 0 -1px 0 #138a35, 1px 0 0 #138a35, -1px 0 0 #138a35; }
.btn:active { box-shadow: 0 2px 0 #138a35, 0 4px 12px rgba(20,120,50,.4), inset 0 2px 0 rgba(255,255,255,.65); }
.btn.ghost { background: linear-gradient(180deg, #8fd3ff 0%, #3aa8ff 50%, #1f74e0 100%); color: #fff; text-shadow: 0 2px 0 #1553a8, 1px 0 0 #1553a8, -1px 0 0 #1553a8;
  box-shadow: 0 5px 0 #1553a8, 0 8px 18px rgba(20, 80, 180, .4), inset 0 2px 0 rgba(255,255,255,.55); }
.btn.ghost:active { transform: translateY(3px); box-shadow: 0 2px 0 #1553a8, inset 0 2px 0 rgba(255,255,255,.55); }
.btn.teal { background: linear-gradient(180deg, #ffa3d6 0%, #ff4fa3 50%, #e0207f 100%); color: #fff; text-shadow: 0 2px 0 #a3125b, 1px 0 0 #a3125b, -1px 0 0 #a3125b;
  box-shadow: 0 5px 0 #a3125b, 0 8px 18px rgba(200, 20, 110, .4), inset 0 2px 0 rgba(255,255,255,.55); }

          <div class="stat"><small id="bestL" data-i18n="best"></small><b id="bestN">0</b></div>
        </div>
      </div>
      <div class="newbest" id="newbest" hidden data-i18n="newRecord"></div>
      <div class="offer" id="offer" hidden></div>
      <div class="rank" id="rankLine"></div>

      <button class="piggy-line" id="piggyLine" hidden></button>
      <div class="col">
        <button class="btn" id="again" data-i18n="again"></button>
        <div class="row" style="flex-wrap:nowrap">
          <button class="btn ghost" id="shareBtn" style="flex:1" data-i18n="share"></button>
          <button class="btn ghost" id="toMenu2" style="flex:1" data-i18n="menu"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="win" hidden>

      <button class="x-close" id="winClose" aria-label="×">×</button>

      <div class="win-stars" id="winStars"><i>★</i><i>★</i><i>★</i></div>
      <div class="earn"><b id="winSparks"></b><b id="winStarGain"></b></div>
      <p class="note" id="winNote" style="text-align:center"></p>
      <div class="col">
        <button class="btn" id="winNext"></button>
        <div class="row" style="flex-wrap:nowrap">
          <button class="btn teal" id="winVillage" style="flex:1" data-i18n="villageGo"></button>
          <button class="btn ghost" id="toMenu3" style="flex:1" data-i18n="menu"></button>
        </div>
      </div>
    </div>
  </div>

      <button class="x-close" id="lvlClose" aria-label="×">×</button>

      <div class="lvl-goal" id="lvlGoal"></div>
      <p class="note" style="text-align:center" data-i18n="starsHint"></p>
      <b class="boost-title" data-i18n="boosts"></b>
      <div class="boosts" id="lvlBoosts"></div>
      <div class="col">
        <button class="btn" id="lvlGo" data-i18n="play"></button>

      <div class="tabs" id="sheetTabs"></div>
      <div class="ptr" id="ptr"></div><div class="sheet-body" id="sheetBody"></div>

      <h2 data-i18n="dailyReward"></h2>

      <button class="btn" id="dailyClaim" data-i18n="claim"></button>
    </div>

        <button class="btn" id="shareGo" data-i18n="share"></button>
        <button class="btn ghost" id="shareClose" data-i18n="back"></button>
      </div>
    </div>
  </div>

        <button class="sbtn ghost" id="livesClose" style="align-self:center" data-i18n="back"></button>

    </div>
  </div>

    <div class="card"><div style="font-size:56px;line-height:1">🔮</div><p data-i18n="capsuleResult"></p><b id="capRes" style="font: 900 24px var(--display); color: var(--glow)"></b><button class="btn" id="capClose">OK</button></div>
  </div>

  <div class="overlay" id="consentM" hidden style="z-index:12; background: rgba(26,8,60,.78)">
    <div class="card">
      <h2 data-i18n="privacyTitle"></h2>

        <div class="item"><div class="txt"><b data-i18n="cAnalytics"></b><small data-i18n="cAnalytics_d"></small></div><button class="toggle" id="cAnalytics" aria-label="Analytics"><i></i></button></div>
        <div class="item"><div class="txt"><b data-i18n="cPersonal"></b><small data-i18n="cPersonal_d"></small></div><button class="toggle" id="cPersonal" aria-label="Personalisierung"><i></i></button></div>
      </div>
      <div class="row" style="flex-wrap:nowrap;width:100%">
        <button class="btn ghost" id="cAll" style="flex:1;font-size:16px;padding:12px 8px" data-i18n="acceptAll"></button>
        <button class="btn ghost" id="cNone" style="flex:1;font-size:16px;padding:12px 8px" data-i18n="onlyNeeded"></button>
      </div>
      <button class="sbtn ghost" id="cSave" data-i18n="saveChoice"></button>
    </div>
  </div>

  <div class="overlay" id="welcomeM" hidden style="z-index:9; background: rgba(26,8,60,.6)">
    <div class="card"><div style="font-size:56px;line-height:1">🎁</div><h2 data-i18n="welcomeBack"></h2><p id="welcomeTxt"></p><button class="btn" id="welcomeOk" data-i18n="claim"></button></div>
  </div>

  <div class="overlay" id="pushM" hidden style="z-index:9; background: rgba(26,8,60,.6)">
    <div class="card"><div style="font-size:56px;line-height:1">🔔</div><h2 data-i18n="pushAskTitle"></h2><p id="pushReason"></p>
      <div class="col"><button class="btn" id="pushYes" data-i18n="pushYes"></button><button class="sbtn ghost" id="pushNo" style="align-self:center" data-i18n="pushNo"></button></div></div>
  </div>

  <div class="ad" id="adO" hidden>
    <b data-i18n="adTitle"></b>
    <small data-i18n="adNote"></small>
    <div class="chip" id="adCount"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <button class="corner" id="pause" aria-label="Pause" hidden>

  </button>
  <button class="corner" id="mute" aria-label="Sound"></button>
  <button class="corner" id="gear" aria-label="Optionen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>
